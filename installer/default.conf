# Virtual AC3 Encoder configuration.  (Restart the engine, or log off+on, after editing.)

# Capture device = the virtual cable's recording endpoint (install VB-CABLE; see QUICKSTART):
in=CABLE Output

# Output: auto-pick the first S/PDIF (optical) output that accepts AC3. To force a specific
# one, comment out the line below and set an exact name from `engine.exe --list`, e.g.:
#   out=Realtek Digital Output
out_spdif=1

bitrate=640000
loopback=0

# Upmix stereo input to 5.1 (free DTS Neo:PC-style matrix). "surround" (default) or "off":
upmix=surround

# Physical output mode: "ac3" (Dolby Digital 5.1, default), "dts" (DTS 5.1), or "pcm" (stereo PCM):
output_mode=ac3

# DTS bitrate when output_mode=dts: "full" (1536000 bps / 1.5 Mbps, default) or "half" (768000 bps):
dts_rate=full
